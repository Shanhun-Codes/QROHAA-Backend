name: Bootstrap QA Platform Admins

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::545009862799:role/qrohaa-github-qa-deploy
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push admin image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: qrohaa-backend
          IMAGE_TAG: qa-admin-${{ github.sha }}
        run: |
          docker build \
            --target admin \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "ADMIN_IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Get QA configuration
        id: qa
        run: |
          SERVICE_JSON=$(aws ecs describe-services \
            --cluster qrohaa \
            --services qrohaa-qa-backend-service-vi76oknv)

          echo "$SERVICE_JSON" | jq -e '.services[0].status == "ACTIVE"' > /dev/null

          NETWORK=$(echo "$SERVICE_JSON" | jq -c \
            '.services[0].networkConfiguration')

          TASK_DEFINITION=$(echo "$SERVICE_JSON" | jq -r \
            '.services[0].taskDefinition')

          echo "network=$NETWORK" >> "$GITHUB_OUTPUT"
          echo "task_definition=$TASK_DEFINITION" >> "$GITHUB_OUTPUT"

      - name: Register temporary admin task definition
        id: task
        env:
          BASE_TASK: ${{ steps.qa.outputs.task_definition }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "$BASE_TASK" \
            --query taskDefinition \
            --output json > task-definition.json

          jq \
            --arg image "$ADMIN_IMAGE" \
            '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy,
              .deregisteredAt
            )
            | .family = "qrohaa-qa-admin-bootstrap"
            | .containerDefinitions |= map(
                if .name == "qrohaa-backend" then
                  .image = $image
                  | .command = ["npm", "run", "bootstrap:platform-admins"]
                  | del(.portMappings, .healthCheck)
                else
                  .
                end
              )
            ' task-definition.json > admin-task-definition.json

          TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://admin-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "task_arn=$TASK_ARN" >> "$GITHUB_OUTPUT"

      - name: Run QA admin bootstrap
        env:
          ADMIN_SUBS: ${{ secrets.PLATFORM_ADMIN_COGNITO_SUBS }}
          TASK_ARN: ${{ steps.task.outputs.task_arn }}
          NETWORK: ${{ steps.qa.outputs.network }}
        run: |
          if [ -z "$ADMIN_SUBS" ]; then
            echo "Missing PLATFORM_ADMIN_COGNITO_SUBS secret"
            exit 1
          fi

          OVERRIDES=$(jq -nc \
            --arg subs "$ADMIN_SUBS" \
            '{
              containerOverrides: [{
                name: "qrohaa-backend",
                environment: [{
                  name: "PLATFORM_ADMIN_COGNITO_SUBS",
                  value: $subs
                }]
              }]
            }')

          RUN_RESULT=$(aws ecs run-task \
            --cluster qrohaa \
            --launch-type FARGATE \
            --task-definition "$TASK_ARN" \
            --network-configuration "$NETWORK" \
            --overrides "$OVERRIDES" \
            --output json)

          echo "$RUN_RESULT" | jq -e \
            '(.failures | length) == 0 and (.tasks | length) == 1' \
            > /dev/null

          RUNNING_TASK=$(echo "$RUN_RESULT" | jq -r \
            '.tasks[0].taskArn')

          echo "Bootstrap ECS task: $RUNNING_TASK"

          aws ecs wait tasks-stopped \
            --cluster qrohaa \
            --tasks "$RUNNING_TASK"

          TASK_RESULT=$(aws ecs describe-tasks \
            --cluster qrohaa \
            --tasks "$RUNNING_TASK" \
            --output json)

          EXIT_CODE=$(echo "$TASK_RESULT" | jq -r \
            '.tasks[0].containers[] | select(.name == "qrohaa-backend") | .exitCode')

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Bootstrap failed. Exit code: $EXIT_CODE"
            echo "$TASK_RESULT" | jq \
              '.tasks[0] | {stopCode, stoppedReason, containers: [.containers[] | {name, reason, exitCode}]}'
            exit 1
          fi

          echo "QA platform-admin bootstrap completed successfully."
